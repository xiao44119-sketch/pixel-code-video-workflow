<script type="module">
// ============================================================
// 0. 全局配置（坐标均为画面归一化坐标，左上角为 0,0）
// ============================================================
const CONFIG = {
  plates: [
    "assets/shot1_base.jpg",
    "assets/shot2_push.jpg",
    "assets/shot3_summit.jpg",
  ],
  fissure: [0.50, 0.52],   // Shot2 金色裂缝的大致中心：火星发射点
  burst:   [0.50, 0.56],   // Shot3 手掌触石点：冲击波中心
  sun:     [0.50, 0.20],   // Shot3 朝阳位置：神光汇聚点
  seed: 20260101,
  counts: [1800, 1400, 1400, 2600, 1800], // 微尘 / 火星 / 石粉 / 爆散金粉 / 上升金粉
};

const W = 1080;
const H = 1920;
const FPS = 30;
const TOTAL = 1650;
const BURST_T = 37.0; // 第 1110 帧

// ============================================================
// 1. 确定性工具函数
// ============================================================
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6d2b79f5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const clamp01 = (x) => Math.min(1, Math.max(0, x));
const ss = (a, b, x) => {
  const t = clamp01((x - a) / (b - a));
  return t * t * (3 - 2 * t);
};
const easeInOut = (x) => {
  const t = clamp01(x);
  return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
};
const win = (a, b, c, d, x) => ss(a, b, x) * (1 - ss(c, d, x));

function integ(fn, t0, t1) {
  if (t1 <= t0) return 0;
  const dt = 1 / 240;
  let sum = 0;
  for (let x = t0; x < t1; x += dt) {
    const h = Math.min(dt, t1 - x);
    sum += fn(x + h * 0.5) * h;
  }
  return sum;
}

// 粒子时钟：p5 清醒时刻与 p8 留白时几乎静止
const speed = (t) =>
  1 - 0.88 * win(27.2, 27.9, 31.0, 31.6, t) - 0.7 * win(42.5, 43.2, 46.4, 47.0, t);
const clock = (t) => integ(speed, 0, t);
const CLOCK_BURST = clock(BURST_T);

// 心跳：p3–p4 平稳，p5 放慢，p6 加速
const bpm = (t) => 56 - 24 * ss(27.0, 28.0, t) + 72 * ss(31.5, 36.0, t);
function beatShape(fr) {
  const g = (c, w) => Math.exp(-(((fr - c) / w) ** 2));
  return g(0.06, 0.045) + g(1.06, 0.045) + 0.55 * g(0.30, 0.06);
}

// 弱雷光，最后一道闪电承担 Shot1 → Shot2 的转场
const LIGHTNING = [[2.6, 0.5], [7.3, 0.32], [11.8, 0.62], [15.62, 0.95]];
function lightning(t) {
  let v = 0;
  for (const [te, s] of LIGHTNING) {
    const d = t - te;
    if (d < 0 || d > 0.9) continue;
    v += s * (
      Math.exp(-d * 16) +
      0.55 * Math.exp(-(((d - 0.13) / 0.035) ** 2)) +
      0.3 * Math.exp(-(((d - 0.29) / 0.05) ** 2))
    );
  }
  return v;
}

// ============================================================
// 2. 三个镜头的运镜 [scale, offX, offY, rot]
// ============================================================
function cam1(t) {
  const e = easeInOut(t / 16);
  return [
    1.10 + 0.10 * e,
    0.004 * Math.sin(t * 0.21),
    0.035 - 0.06 * e,
    0.004 * Math.sin(t * 0.13),
  ];
}

function cam2(t, beat) {
  const u = (t - 16) / 20.5;
  const e = easeInOut(u);
  const ph = (((t - 16) % 2.6) + 2.6) % 2.6 / 2.6;
  let env = ph < 0.35 ? ss(0, 0.35, ph) : 1 - ss(0.35, 1, ph);
  env *= 1 - 0.85 * win(27.2, 27.9, 31.0, 31.6, t);
  const shakeX = env * 0.0016 * (Math.sin(t * 37) + 0.6 * Math.sin(t * 53));
  const shakeY = env * 0.0012 * (Math.sin(t * 41 + 1.3) + 0.5 * Math.sin(t * 59));
  const fx = (CONFIG.fissure[0] - 0.5) * 0.5625 * 0.25 * e;
  const fy = (CONFIG.fissure[1] - 0.5) * 0.25 * e;
  return [
    1.14 + 0.12 * e + 0.05 * ss(31.5, 36.3, t) + 0.014 * env + 0.004 * beat,
    fx + shakeX,
    fy + 0.006 * env + shakeY,
    0.003 * Math.sin(t * 0.4) + env * 0.002,
  ];
}

function cam3(t) {
  const b = t - BURST_T;
  if (b < 0) {
    return [1.20 + 0.03 * ss(36.5, 37.0, t), 0, 0.01, 0];
  }
  const kick = Math.exp(-b * 4);
  return [
    1.23 - 0.07 * (1 - Math.exp(-b * 5)) - 0.07 * ss(37.0, 55.0, t),
    0.006 * kick * Math.sin(b * 61),
    0.01 - 0.03 * ss(38.0, 55.0, t) + 0.005 * kick * Math.sin(b * 47),
    0.002 * kick * Math.sin(b * 33),
  ];
}

// ============================================================
// 3. 帧状态：只依赖帧号 f，t = f / 30
// ============================================================
function frameState(f) {
  const t = f / FPS;
  const pt = clock(t);
  const b = t - BURST_T;
  const s = { t, pt, f };

  s.w = [
    1 - ss(15.7, 16.3, t),
    ss(15.7, 16.3, t) * (1 - ss(36.25, 36.5, t)),
    ss(36.45, 36.75, t),
  ];
  s.light = lightning(t);

  if (t >= 16) {
    const ph = integ((x) => bpm(x) / 60, 16, t);
    s.beat = beatShape(ph - Math.floor(ph));
  } else {
    s.beat = 0;
  }
  s.pulse = (0.3 + 0.9 * s.beat) * (0.8 + 0.6 * ss(31.5, 36.0, t));
  s.dark2 = 0.15 * ss(31.5, 36.0, t) + 0.85 * ss(35.7, 36.5, t);

  s.cam1 = cam1(t);
  s.cam2 = cam2(t, s.beat);
  s.cam3 = cam3(t);

  s.revealOn = b >= 0 ? 1 : 0;
  s.radius = b >= 0 ? 0.02 + 1.0 * (1 - Math.exp(-b * 3.2)) : 0;
  s.calm3 = 0.5 + 0.5 * Math.sin((t - BURST_T) * Math.PI * 2 / 4.2);

  s.shockAge = Math.max(0, b);
  s.shockOn = b >= 0 && b < 3.5 ? 1 : 0;
  s.flash = b >= 0 ? 0.85 * Math.exp(-b * 7) : 0;
  s.rays = ss(37.0, 38.4, t) * (1 - 0.3 * win(42.5, 43.2, 46.4, 47.0, t)) * (0.9 + 0.1 * Math.sin(t * 0.7));
  s.vig = t < 36.5 ? 0.58 : b < 0 ? 0.58 + 0.22 * ss(36.5, 37.0, t) : 0.40 + 0.40 * Math.exp(-b * 3);
  s.ca = b < 0 ? 1.0 + 2.0 * ss(36.5, 37.0, t) : 1.0;
  s.grain = t < 16 ? 0.06 : t < 36.5 ? 0.052 : 0.042;
  s.fade = ss(0, 1.6, t) * (1 - ss(53.6, 55.0, t));
  s.burstAge = b >= 0 ? pt - CLOCK_BURST : -1;
  s.dawn = ss(37.0, 39.0, t);
  return s;
}

// ============================================================
// 4. 着色器
// ============================================================
const VS_QUAD = `#version 300 es
layout(location = 0) in vec2 aPos;
out vec2 vUv;
void main() {
  vUv = aPos * 0.5 + 0.5;
  gl_Position = vec4(aPos, 0.0, 1.0);
}`;

const FS_SCENE = `#version 300 es
precision highp float;
in vec2 vUv;
out vec4 o;

uniform sampler2D uT1;
uniform sampler2D uT2;
uniform sampler2D uT3;
uniform vec3 uAsp;
uniform vec4 uCam1;
uniform vec4 uCam2;
uniform vec4 uCam3;
uniform vec3 uW;
uniform float uTime;
uniform float uLight;
uniform float uPulse;
uniform float uDark2;
uniform float uRadius;
uniform float uRevealOn;
uniform float uCalm3;
uniform vec2 uBurst;

const float SA = 0.5625;
const vec3 OBS = vec3(0.027, 0.031, 0.043);

float hash(vec2 p) {
  p = fract(p * vec2(123.34, 456.21));
  p += dot(p, p + 45.32);
  return fract(p.x * p.y);
}
float noise(vec2 p) {
  vec2 i = floor(p);
  vec2 f = fract(p);
  vec2 u = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash(i), hash(i + vec2(1.0, 0.0)), u.x),
             mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), u.x), u.y);
}
float fbm(vec2 p) {
  float v = 0.0;
  float a = 0.5;
  for (int i = 0; i < 5; i++) {
    v += a * noise(p);
    p = p * 2.03 + vec2(1.7, 9.2);
    a *= 0.5;
  }
  return v;
}
float luma(vec3 c) { return dot(c, vec3(0.2126, 0.7152, 0.0722)); }
vec3 contrast(vec3 c, float k) { return clamp((c - 0.5) * k + 0.5, 0.0, 1.0); }

vec2 camUV(vec2 uvT, vec4 cam, float ia, float par) {
  vec2 p = (uvT - 0.5) * vec2(SA, 1.0);
  float c = cos(cam.w);
  float s = sin(cam.w);
  p = mat2(c, -s, s, c) * p;
  p /= cam.x;
  p += cam.yz * (1.0 + par * (p.y + 0.5));
  float k = max(SA / ia, 1.0);
  return vec2(p.x / (ia * k) + 0.5, p.y / k + 0.5);
}

float warmMask(vec3 c) {
  float l = luma(c);
  return smoothstep(0.06, 0.30, c.r - c.b) * smoothstep(0.22, 0.65, l);
}

vec3 shot1(vec2 uvT) {
  vec2 uv = camUV(uvT, uCam1, uAsp.x, 0.35);
  float sky = 1.0 - smoothstep(0.25, 0.6, uv.y);
  vec2 w = vec2(fbm(uv * 3.0 + vec2(uTime * 0.03, 0.0)),
                fbm(uv * 3.0 + vec2(5.2, uTime * 0.025))) - 0.5;
  uv += w * 0.012 * sky;
  vec3 c = texture(uT1, uv).rgb;
  float l = luma(c);
  c = mix(vec3(l), c, 0.5);
  c *= vec3(0.80, 0.92, 1.10);
  c = contrast(c, 1.12) * 0.88;
  float cs = fbm(uv * vec2(2.0, 3.0) + vec2(-uTime * 0.04, uTime * 0.01));
  c *= mix(1.0, 0.75 + 0.5 * cs, sky * 0.6);
  float lf = uLight * (0.35 + 0.65 * fbm(uv * 4.0 + uTime));
  c += lf * vec3(0.50, 0.62, 0.85) * (sky * 0.9 + 0.25) * (0.25 + l);
  return c;
}

vec3 shot2(vec2 uvT) {
  vec2 uv = camUV(uvT, uCam2, uAsp.y, 0.25);
  float wm = warmMask(texture(uT2, uv).rgb);
  vec2 hz = vec2(noise(uv * 40.0 + vec2(0.0, -uTime * 1.6)),
                 noise(uv * 40.0 + vec2(7.0, -uTime * 1.9))) - 0.5;
  uv += hz * 0.0035 * (0.3 + wm) * (0.5 + uPulse);
  vec3 c = texture(uT2, uv).rgb;
  float l = luma(c);
  float w = warmMask(c);
  float halo = 0.0;
  for (int i = 0; i < 8; i++) {
    float a = float(i) * 0.785398;
    vec2 o2 = vec2(cos(a) / SA, sin(a)) * 0.0056;
    halo += warmMask(texture(uT2, uv + o2).rgb);
    halo += 0.6 * warmMask(texture(uT2, uv + o2 * 2.2).rgb);
  }
  halo /= 12.8;
  vec3 cool = mix(vec3(l), c, 0.45) * vec3(0.82, 0.90, 1.02);
  c = mix(cool, c * vec3(1.08, 0.96, 0.84), w);
  c = contrast(c, 1.15) * 0.9;
  c += vec3(1.0, 0.56, 0.18) * (w * 0.9 + halo * 0.55) * uPulse;
  c *= 1.0 - uDark2;
  return c;
}

vec3 shot3(vec2 uvT) {
  vec2 uv = camUV(uvT, uCam3, uAsp.z, 0.3);
  vec3 c = texture(uT3, uv).rgb;
  float l = luma(c);
  float w = warmMask(c);
  vec3 night = mix(vec3(l), c, 0.25) * vec3(0.55, 0.68, 0.95) * 0.32;
  vec3 dawn = contrast(c * vec3(1.06, 0.98, 0.86), 1.08);
  dawn += vec3(1.0, 0.62, 0.25) * w * (0.25 + 0.25 * uCalm3);
  vec2 d = (uvT - uBurst) * vec2(SA, 1.0);
  float r = length(d);
  float edge = (fbm(vec2(atan(d.y, d.x) * 3.0, uTime * 0.5)) - 0.5) * 0.12;
  float m = uRevealOn * (1.0 - smoothstep(uRadius - 0.05 + edge, uRadius + 0.05 + edge, r));
  return mix(night, dawn, m);
}

void main() {
  vec2 uvT = vec2(vUv.x, 1.0 - vUv.y);
  vec3 c = vec3(0.0);
  if (uW.x > 0.001) c += shot1(uvT) * uW.x;
  if (uW.y > 0.001) c += shot2(uvT) * uW.y;
  if (uW.z > 0.001) c += shot3(uvT) * uW.z;
  c = OBS + c * (1.0 - OBS);
  o = vec4(c, 1.0);
}`;

const VS_PART = `#version 300 es
precision highp float;
layout(location = 0) in vec4 aSeed;
layout(location = 1) in float aKind;

uniform float uPT;
uniform float uPulse;
uniform float uBurstAge;
uniform float uDawn;
uniform vec3 uW;
uniform vec2 uFissure;
uniform vec2 uBurst;

out vec4 vCol;
out float vSoft;

const vec2 RES = vec2(1080.0, 1920.0);
const float PI = 3.14159265;

float h(float x) { return fract(sin(x) * 43758.5453); }

void main() {
  vec2 p = vec2(-9999.0);
  float a = 0.0;
  float sz = 1.0;
  vec3 c = vec3(1.0);
  float soft = 0.5;
  int k = int(aKind + 0.5);

  if (k == 0) {
    float L = 7.0 + 5.0 * aSeed.x;
    float age = mod(uPT + aSeed.y * L, L);
    p.x = aSeed.z * RES.x + sin(uPT * 0.35 + aSeed.w * 6.2831) * 28.0 + age * (6.0 + 10.0 * aSeed.y);
    p.y = RES.y * (0.25 + 0.75 * aSeed.w) - age * (10.0 + 22.0 * aSeed.x);
    float s = sin(PI * age / L);
    a = s * s * (0.18 + 0.35 * aSeed.y) * uW.x;
    bool bokeh = aSeed.x > 0.9;
    sz = bokeh ? 10.0 + 14.0 * aSeed.z : 1.6 + 2.4 * aSeed.z;
    if (bokeh) a *= 0.35;
    soft = bokeh ? 0.9 : 0.55;
    c = vec3(0.62, 0.72, 0.86);
  } else if (k == 1) {
    float L = 1.1 + 1.3 * aSeed.x;
    float cyc = uPT + aSeed.y * L * 7.0;
    float age = mod(cyc, L);
    float id = floor(cyc / L);
    float r1 = h((id + 1.0) * (aSeed.z * 91.7 + 3.1));
    float r2 = h((id + 1.0) * (aSeed.w * 57.3 + 7.7));
    vec2 e = uFissure * RES + vec2((r1 - 0.5) * 380.0, (r2 - 0.5) * 220.0);
    vec2 v = vec2((aSeed.z - 0.5) * 520.0, -(160.0 + 420.0 * aSeed.w));
    p = e + v * age + vec2(60.0 * age * age, 280.0 * age * age);
    float life = 1.0 - age / L;
    a = life * life * (0.55 + 0.45 * uPulse) * uW.y;
    sz = 1.6 + 2.6 * aSeed.x * life;
    c = mix(vec3(1.0, 0.45, 0.12), vec3(1.0, 0.86, 0.55), life);
    soft = 0.35;
  } else if (k == 2) {
    float L = 4.0 + 4.0 * aSeed.x;
    float age = mod(uPT * 0.8 + aSeed.y * L, L);
    vec2 e = vec2(aSeed.z * RES.x, RES.y * (0.35 + 0.4 * aSeed.w));
    p = e + vec2(age * (30.0 + 50.0 * aSeed.y) + sin(age * 1.7 + aSeed.z * 9.0) * 14.0,
                 age * age * 9.0 - age * 6.0);
    a = sin(PI * age / L) * 0.16 * uW.y * (0.7 + 0.3 * uPulse);
    sz = 2.0 + 5.0 * aSeed.w;
    soft = 0.95;
    c = vec3(0.55, 0.52, 0.48);
  } else if (k == 3) {
    if (uBurstAge > 0.0) {
      float b = uBurstAge;
      float ang = aSeed.x * 6.2831853;
      float spd = 260.0 + 1700.0 * aSeed.y * aSeed.y;
      float kd = 1.6 + 1.4 * aSeed.z;
      float dist = spd / kd * (1.0 - exp(-kd * b));
      vec2 dir = vec2(cos(ang), sin(ang));
      p = uBurst * RES + dir * dist
        + vec2(sin(b * 0.9 + aSeed.w * 6.28) * 20.0 * b, -(18.0 + 40.0 * aSeed.w) * b);
      float tw = 0.65 + 0.35 * sin(b * (3.0 + 5.0 * aSeed.z) + aSeed.w * 20.0);
      a = exp(-b * 0.28) * tw * uW.z;
      sz = (1.4 + 3.4 * aSeed.w) * (1.0 + 1.6 * exp(-b * 3.0));
      c = mix(vec3(1.0, 0.95, 0.85), vec3(1.0, 0.74, 0.36), clamp(b * 0.6, 0.0, 1.0));
      soft = 0.4;
    }
  } else {
    float L = 6.0 + 6.0 * aSeed.x;
    float age = mod(uPT + aSeed.y * L, L);
    p = vec2(aSeed.z * RES.x + sin(age * 0.8 + aSeed.w * 6.28) * 36.0,
             RES.y * (0.55 + 0.45 * aSeed.w) - age * (40.0 + 70.0 * aSeed.y));
    a = sin(PI * age / L) * (0.25 + 0.5 * aSeed.y) * uDawn * uW.z;
    bool bokeh = aSeed.x > 0.92;
    sz = bokeh ? 8.0 + 12.0 * aSeed.z : 1.4 + 2.6 * aSeed.z;
    if (bokeh) a *= 0.4;
    c = vec3(1.0, 0.8, 0.48);
    soft = bokeh ? 0.9 : 0.5;
  }

  if (a <= 0.002) {
    gl_Position = vec4(2.0, 2.0, 0.0, 1.0);
    gl_PointSize = 0.0;
    vCol = vec4(0.0);
    vSoft = 0.0;
    return;
  }
  gl_Position = vec4(p.x / RES.x * 2.0 - 1.0, 1.0 - p.y / RES.y * 2.0, 0.0, 1.0);
  gl_PointSize = sz;
  vCol = vec4(c, a);
  vSoft = soft;
}`;

const FS_PART = `#version 300 es
precision highp float;
in vec4 vCol;
in float vSoft;
out vec4 o;
void main() {
  vec2 q = gl_PointCoord * 2.0 - 1.0;
  float d = dot(q, q);
  if (d > 1.0) discard;
  float f = pow(1.0 - d, mix(3.0, 1.2, vSoft));
  o = vec4(vCol.rgb, vCol.a * f);
}`;

const FS_POST = `#version 300 es
precision highp float;
in vec2 vUv;
out vec4 o;

uniform sampler2D uScene;
uniform float uTime;
uniform float uFrame;
uniform float uShockAge;
uniform float uShockOn;
uniform float uRadius;
uniform float uRays;
uniform float uFlash;
uniform float uFade;
uniform float uVig;
uniform float uCA;
uniform float uGrain;
uniform vec2 uBurst;
uniform vec2 uSun;

const float SA = 0.5625;
const vec3 OBS = vec3(0.027, 0.031, 0.043);

vec3 S(vec2 u) { return texture(uScene, vec2(u.x, 1.0 - u.y)).rgb; }
float luma(vec3 c) { return dot(c, vec3(0.2126, 0.7152, 0.0722)); }
float h1(float x) { return fract(sin(x * 127.1) * 43758.5453); }
float n1(float x) {
  float i = floor(x);
  float f = fract(x);
  f = f * f * (3.0 - 2.0 * f);
  return mix(h1(i), h1(i + 1.0), f);
}
float grain(vec2 p, float fr) {
  uvec3 v = uvec3(uvec2(p), uint(fr));
  uint x = v.x * 1973u + v.y * 9277u + v.z * 26699u;
  x = (x >> 13u) ^ x;
  x = x * (x * x * 15731u + 789221u) + 1376312589u;
  return float(x & 0x7fffffffu) / 2147483647.0;
}

void main() {
  vec2 uvT = vec2(vUv.x, 1.0 - vUv.y);

  vec2 d = (uvT - uBurst) * vec2(SA, 1.0);
  float dist = length(d);
  vec2 dir = d / (dist + 1e-5);
  float band = uShockOn * exp(-pow((dist - uRadius) / 0.055, 2.0));
  float decay = exp(-uShockAge * 1.4);
  vec2 uvD = uvT - vec2(dir.x / SA, dir.y) * band * 0.05 * decay;

  vec2 cd = uvD - 0.5;
  float ca = uCA * 0.008 * length(cd)
           + band * 0.018 * decay
           + uShockOn * 0.010 * exp(-uShockAge * 3.0);
  vec3 col = vec3(S(uvD + cd * ca).r, S(uvD).g, S(uvD - cd * ca).b);

  vec3 bl = vec3(0.0);
  for (int i = 0; i < 8; i++) {
    float a = float(i) * 0.785398 + 0.39;
    vec2 o2 = vec2(cos(a) / SA, sin(a));
    bl += max(S(uvD + o2 * 0.006) - 0.6, 0.0);
    bl += max(S(uvD + o2 * 0.016) - 0.6, 0.0) * 0.7;
  }
  col += bl * 0.12;

  if (uRays > 0.001) {
    vec2 delta = (uvD - uSun) * (0.92 / 48.0);
    vec2 c = uvD;
    float ill = 1.0;
    float acc = 0.0;
    for (int i = 0; i < 48; i++) {
      c -= delta;
      vec3 s = S(c);
      float warm = clamp((s.r - s.b) * 2.0 + 0.4, 0.0, 1.0);
      acc += max(luma(s) - 0.5, 0.0) * warm * ill;
      ill *= 0.96;
    }
    vec2 sd = (uvD - uSun) * vec2(SA, 1.0);
    float ang = atan(sd.y, sd.x);
    float streak = 0.45 + 0.55 * n1(ang * 14.0 + uTime * 0.12) * n1(ang * 31.0 - uTime * 0.07 + 3.0) * 1.6;
    float fall = exp(-length(sd) * 1.2);
    col += vec3(1.0, 0.78, 0.46) * acc * 0.11 * uRays * streak * (0.6 + 0.8 * fall);
    col += vec3(1.0, 0.82, 0.55) * exp(-length(sd) * 6.0) * 0.35 * uRays;
  }

  col += vec3(1.0, 0.82, 0.52) * band * decay * 0.9;
  col = mix(col, vec3(1.0, 0.94, 0.80), clamp(uFlash, 0.0, 1.0));

  vec3 x = max(col - 0.8, 0.0);
  col = min(col, vec3(0.8)) + 0.2 * (1.0 - exp(-x * 5.0));

  vec2 vq = (uvT - vec2(0.5, 0.44)) * vec2(1.0, 0.78) * 1.35;
  float v = 1.0 - smoothstep(0.2, 1.05, length(vq));
  col *= mix(1.0 - uVig, 1.0, v);

  col *= uFade;

  float g = grain(gl_FragCoord.xy, uFrame) - 0.5;
  col += g * uGrain * (1.0 - 0.55 * luma(col));

  float py = uvT.y * 1920.0;
  float a = smoothstep(1344.0, 1536.0, py) * 0.96;
  if (py >= 1536.0) a = mix(0.97, 1.0, (py - 1536.0) / 384.0);
  vec3 obsZone = OBS * mix(1.0, 0.6, smoothstep(1536.0, 1920.0, py));
  col = mix(col, obsZone, a);

  o = vec4(clamp(col, 0.0, 1.0), 1.0);
}`;

// ============================================================
// 5. WebGL 初始化
// ============================================================
const params = new URLSearchParams(location.search);
const RENDER_MODE = params.get("render") === "1";
if (RENDER_MODE) document.body.classList.add("render");

const canvas = document.getElementById("c");
const statusEl = document.getElementById("status");
const gl = canvas.getContext("webgl2", {
  antialias: false,
  alpha: false,
  preserveDrawingBuffer: true,
  premultipliedAlpha: false,
});
if (!gl) throw new Error("当前浏览器不支持 WebGL2");

function compile(type, src) {
  const sh = gl.createShader(type);
  gl.shaderSource(sh, src);
  gl.compileShader(sh);
  if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) {
    throw new Error(gl.getShaderInfoLog(sh));
  }
  return sh;
}
function program(vs, fs) {
  const p = gl.createProgram();
  gl.attachShader(p, compile(gl.VERTEX_SHADER, vs));
  gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) {
    throw new Error(gl.getProgramInfoLog(p));
  }
  p._loc = {};
  return p;
}
function loc(p, name) {
  if (!(name in p._loc)) p._loc[name] = gl.getUniformLocation(p, name);
  return p._loc[name];
}
function setU(p, name, ...v) {
  const l = loc(p, name);
  if (l === null) return;
  if (v.length === 1) gl.uniform1f(l, v[0]);
  else if (v.length === 2) gl.uniform2f(l, v[0], v[1]);
  else if (v.length === 3) gl.uniform3f(l, v[0], v[1], v[2]);
  else gl.uniform4f(l, v[0], v[1], v[2], v[3]);
}
function setI(p, name, i) {
  const l = loc(p, name);
  if (l !== null) gl.uniform1i(l, i);
}

const progScene = program(VS_QUAD, FS_SCENE);
const progPart = program(VS_PART, FS_PART);
const progPost = program(VS_QUAD, FS_POST);

const quadVAO = gl.createVertexArray();
gl.bindVertexArray(quadVAO);
const quadBuf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);
gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

const rng = mulberry32(CONFIG.seed);
const totalParticles = CONFIG.counts.reduce((a, b) => a + b, 0);
const partData = new Float32Array(totalParticles * 5);
let pi = 0;
CONFIG.counts.forEach((n, kind) => {
  for (let i = 0; i < n; i++) {
    partData[pi++] = rng();
    partData[pi++] = rng();
    partData[pi++] = rng();
    partData[pi++] = rng();
    partData[pi++] = kind;
  }
});
const partVAO = gl.createVertexArray();
gl.bindVertexArray(partVAO);
const partBuf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, partBuf);
gl.bufferData(gl.ARRAY_BUFFER, partData, gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);
gl.vertexAttribPointer(0, 4, gl.FLOAT, false, 20, 0);
gl.enableVertexAttribArray(1);
gl.vertexAttribPointer(1, 1, gl.FLOAT, false, 20, 16);
gl.bindVertexArray(null);

const sceneTex = gl.createTexture();
gl.bindTexture(gl.TEXTURE_2D, sceneTex);
gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, W, H, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
const fbo = gl.createFramebuffer();
gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, sceneTex, 0);
gl.bindFramebuffer(gl.FRAMEBUFFER, null);

// ============================================================
// 6. 垫图加载（失败时使用程序化占位图，保证可运行）
// ============================================================
function loadImage(src) {
  return new Promise((resolve) => {
    const im = new Image();
    im.onload = () => resolve(im);
    im.onerror = () => resolve(null);
    im.src = src;
  });
}

function fallbackPlate(kind) {
  const c = document.createElement("canvas");
  c.width = W;
  c.height = H;
  const x = c.getContext("2d");
  const r = mulberry32(CONFIG.seed + kind * 97);
  const g = x.createLinearGradient(0, 0, 0, H);
  if (kind === 0) {
    g.addColorStop(0, "#1a2230");
    g.addColorStop(1, "#05060a");
  } else if (kind === 1) {
    g.addColorStop(0, "#14161c");
    g.addColorStop(1, "#08090c");
  } else {
    g.addColorStop(0, "#f2c27a");
    g.addColorStop(0.35, "#8a5a32");
    g.addColorStop(1, "#0a0a0d");
  }
  x.fillStyle = g;
  x.fillRect(0, 0, W, H);
  x.fillStyle = "#0b0c10";
  x.beginPath();
  x.moveTo(0, H);
  x.lineTo(0, 1300);
  x.lineTo(540, kind === 2 ? 900 : 700);
  x.lineTo(W, 1250);
  x.lineTo(W, H);
  x.fill();
  if (kind === 1) {
    x.strokeStyle = "#ffb04a";
    x.lineWidth = 3;
    for (let k = 0; k < 14; k++) {
      x.beginPath();
      let px = 300 + r() * 480;
      let py = 800 + r() * 400;
      x.moveTo(px, py);
      for (let s = 0; s < 6; s++) {
        px += (r() - 0.5) * 90;
        py += (r() - 0.3) * 70;
        x.lineTo(px, py);
      }
      x.stroke();
    }
  }
  if (kind === 2) {
    const sg = x.createRadialGradient(540, 380, 0, 540, 380, 260);
    sg.addColorStop(0, "rgba(255,240,200,1)");
    sg.addColorStop(1, "rgba(255,200,120,0)");
    x.fillStyle = sg;
    x.fillRect(0, 0, W, H);
  }
  return c;
}

function uploadTexture(source) {
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, source);
  gl.generateMipmap(gl.TEXTURE_2D);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  return tex;
}

const plates = [];
const aspects = [];
const warnings = [];
for (let i = 0; i < 3; i++) {
  const img = await loadImage(CONFIG.plates[i]);
  let tex = null;
  let asp = W / H;
  if (img) {
    try {
      tex = uploadTexture(img);
      asp = img.naturalWidth / img.naturalHeight;
    } catch (e) {
      warnings.push(`${CONFIG.plates[i]} 无法上传到 WebGL（请用本地服务器打开，而不是 file://）`);
    }
  } else {
    warnings.push(`${CONFIG.plates[i]} 加载失败，已使用占位图`);
  }
  if (!tex) {
    tex = uploadTexture(fallbackPlate(i));
    asp = W / H;
  }
  plates.push(tex);
  aspects.push(asp);
}
statusEl.textContent = warnings.length ? "⚠ " + warnings.join("；") : "垫图已加载 · Clean Feed 母版";

// ============================================================
// 7. 逐帧渲染
// ============================================================
const qcFailures = [];
const qcBuf = new Uint8Array(W * 384 * 4);

function renderFrame(f) {
  const s = frameState(f);

  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
  gl.viewport(0, 0, W, H);
  gl.disable(gl.BLEND);
  gl.useProgram(progScene);
  for (let i = 0; i < 3; i++) {
    gl.activeTexture(gl.TEXTURE0 + i);
    gl.bindTexture(gl.TEXTURE_2D, plates[i]);
  }
  setI(progScene, "uT1", 0);
  setI(progScene, "uT2", 1);
  setI(progScene, "uT3", 2);
  setU(progScene, "uAsp", aspects[0], aspects[1], aspects[2]);
  setU(progScene, "uCam1", ...s.cam1);
  setU(progScene, "uCam2", ...s.cam2);
  setU(progScene, "uCam3", ...s.cam3);
  setU(progScene, "uW", ...s.w);
  setU(progScene, "uTime", s.pt);
  setU(progScene, "uLight", s.light);
  setU(progScene, "uPulse", s.pulse);
  setU(progScene, "uDark2", s.dark2);
  setU(progScene, "uRadius", s.radius);
  setU(progScene, "uRevealOn", s.revealOn);
  setU(progScene, "uCalm3", s.calm3);
  setU(progScene, "uBurst", CONFIG.burst[0], CONFIG.burst[1]);
  gl.bindVertexArray(quadVAO);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  gl.enable(gl.BLEND);
  gl.blendFunc(gl.SRC_ALPHA, gl.ONE);
  gl.useProgram(progPart);
  setU(progPart, "uPT", s.pt);
  setU(progPart, "uPulse", s.pulse);
  setU(progPart, "uBurstAge", s.burstAge);
  setU(progPart, "uDawn", s.dawn);
  setU(progPart, "uW", ...s.w);
  setU(progPart, "uFissure", CONFIG.fissure[0], CONFIG.fissure[1]);
  setU(progPart, "uBurst", CONFIG.burst[0], CONFIG.burst[1]);
  gl.bindVertexArray(partVAO);
  gl.drawArrays(gl.POINTS, 0, totalParticles);
  gl.disable(gl.BLEND);

  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, W, H);
  gl.useProgram(progPost);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, sceneTex);
  setI(progPost, "uScene", 0);
  setU(progPost, "uTime", s.pt);
  setU(progPost, "uFrame", f);
  setU(progPost, "uShockAge", s.shockAge);
  setU(progPost, "uShockOn", s.shockOn);
  setU(progPost, "uRadius", s.radius);
  setU(progPost, "uRays", s.rays);
  setU(progPost, "uFlash", s.flash);
  setU(progPost, "uFade", s.fade);
  setU(progPost, "uVig", s.vig);
  setU(progPost, "uCA", s.ca);
  setU(progPost, "uGrain", s.grain);
  setU(progPost, "uBurst", CONFIG.burst[0], CONFIG.burst[1]);
  setU(progPost, "uSun", CONFIG.sun[0], CONFIG.sun[1]);
  gl.bindVertexArray(quadVAO);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  gl.bindVertexArray(null);

  if (f % 30 === 0) {
    gl.readPixels(0, 0, W, 384, gl.RGBA, gl.UNSIGNED_BYTE, qcBuf);
    let maxLum = 0;
    for (let i = 0; i < qcBuf.length; i += 4) {
      const l = (0.2126 * qcBuf[i] + 0.7152 * qcBuf[i + 1] + 0.0722 * qcBuf[i + 2]) / 255;
      if (l > maxLum) maxLum = l;
    }
    if (maxLum >= 0.08) qcFailures.push({ frame: f, maxLum });
  }
}

// ============================================================
// 8. 导出接口（Puppeteer 逐帧调用）
// ============================================================
window.__renderFrame = (n) => {
  renderFrame(Math.max(0, Math.min(TOTAL - 1, n | 0)));
  return canvas.toDataURL("image/png");
};
window.__qcReport = () => ({
  episode: "EP01",
  totalFrames: TOTAL,
  burstFrame: Math.round(BURST_T * FPS),
  cleanZone: "Y >= 1536",
  pass: qcFailures.length === 0,
  failures: qcFailures,
});

// ============================================================
// 9. 预览播放器（仅用于预览调度，画面状态只由帧号决定）
// ============================================================
const playBtn = document.getElementById("play");
const scrub = document.getElementById("scrub");
const frameInfo = document.getElementById("frameInfo");
let playing = false;
let startPerf = 0;
let startFrame = 0;
let lastFrame = -1;

function show(f) {
  if (f === lastFrame) return;
  lastFrame = f;
  renderFrame(f);
  scrub.value = String(f);
  frameInfo.textContent = `f ${f} / ${(f / FPS).toFixed(2)}s`;
}

function tick(now) {
  if (!playing) return;
  const f = (startFrame + Math.floor(((now - startPerf) / 1000) * FPS)) % TOTAL;
  show(f);
  requestAnimationFrame(tick);
}

playBtn.addEventListener("click", () => {
  playing = !playing;
  playBtn.textContent = playing ? "❚❚ 暂停" : "▶ 播放";
  if (playing) {
    startPerf = performance.now();
    startFrame = lastFrame < 0 ? 0 : lastFrame;
    requestAnimationFrame(tick);
  }
});
scrub.addEventListener("input", () => {
  playing = false;
  playBtn.textContent = "▶ 播放";
  show(Number(scrub.value));
});
window.addEventListener("keydown", (e) => {
  if (e.code === "Space") {
    e.preventDefault();
    playBtn.click();
  }
});

show(0);
window.__ready = true;
</script>
</body>
</html>
